name: Bug report
description: Something behaves differently from the documentation or the tests.
labels: [type/bug, status/triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact command or request, and the output.
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
    validations: {required: true}
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations: {required: true}
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - api
        - web
        - shared
        - auth
        - ops
  - type: dropdown
    id: severity
    attributes:
      label: Impact
      options:
        - "sev1: data loss, security exposure or full outage"
        - "sev2: a core flow is broken with no workaround"
        - "sev3: broken with a workaround, or cosmetic"
    validations: {required: true}
