name: Feature or change
description: Propose a capability, with the problem it solves.
labels: [type/feature, status/triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected and what can't they do today? Leave the solution for the next box.
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
    validations: {required: true}
  - type: textarea
    id: risks
    attributes:
      label: Risks, migrations, rollout
      description: Schema or API changes, backwards compatibility, feature flags, security impact.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - api
        - web
        - shared
        - auth
        - ops
